<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Producto | Paw&amp;Pearl Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="bg-[#fff9ed] text-[#18354c] flex flex-col md:flex-row min-h-screen font-sans">

  <aside class="w-full md:w-64 bg-[#18354c] text-white flex-shrink-0">
    <div class="p-6 flex items-center gap-3 border-b border-white/10">
      <i data-lucide="paw-print" class="w-8 h-8 text-[#ffd15c]"></i>
      <span class="font-bold text-xl tracking-wide">Paw&amp;Pearl</span>
    </div>
    <nav class="p-4 space-y-1 font-medium">
      <a href="index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition text-gray-300">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
      </a>
      <a href="servicios.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition text-gray-300">
        <i data-lucide="stethoscope" class="w-5 h-5"></i> Servicios
      </a>
      <a href="productos.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-[#087f8c] text-white font-semibold shadow-sm">
        <i data-lucide="package" class="w-5 h-5"></i> Productos
      </a>
      <a href="usuarios.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition text-gray-300">
        <i data-lucide="users" class="w-5 h-5"></i> Usuarios
      </a>
      <a href="../index.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition text-gray-300 mt-12">
        <i data-lucide="external-link" class="w-5 h-5"></i> Volver a la Tienda
      </a>
    </nav>
  </aside>

  <main class="flex-1 p-6 md:p-10">
    <header class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-extrabold text-[#18354c]">Nuevo Producto</h1>
      <a href="productos.html" class="text-sm font-bold text-[#087f8c] hover:underline flex items-center gap-1">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver a productos
      </a>
    </header>

    <div class="bg-white rounded-2xl border border-[#18354c]/10 p-6 md:p-8 shadow-sm max-w-3xl">
      <form action="productos.html" method="POST" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold uppercase text-[#5f7180] mb-2">Código SKUs</label>
            <input type="text" required placeholder="Ej: PRD001" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[#087f8c]">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-[#5f7180] mb-2">Nombre Comercial</label>
            <input type="text" required placeholder="Ej: NexGard Spectra" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[#087f8c]">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-[#5f7180] mb-2">Categoría</label>
            <select required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[#087f8c]">
              <option value="">Seleccione una categoría</option>
              <option value="Antiparasitarios">Antiparasitarios</option>
              <option value="Nutrición">Nutrición</option>
              <option value="Accesorios">Accesorios</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-[#5f7180] mb-2">Especie Destino</label>
            <input type="text" required placeholder="Ej: Perro / Gato" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[#087f8c]">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-[#5f7180] mb-2">Stock Inicial</label>
            <input type="number" min="0" required placeholder="0" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[#087f8c]">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-[#5f7180] mb-2">Precio ($)</label>
            <input type="number" min="0" step="100" required placeholder="15000" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[#087f8c]">
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
          <a href="productos.html" class="px-5 py-2.5 rounded-xl border border-gray-300 font-bold hover:bg-gray-50 transition">Cancelar</a>
          <button type="submit" class="bg-[#10b981] hover:bg-[#059669] text-white font-bold px-6 py-2.5 rounded-xl transition shadow-sm">
            Guardar Producto
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="../js/admin.js"></script>
</body>
</html>
